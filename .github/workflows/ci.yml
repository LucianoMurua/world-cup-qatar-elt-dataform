name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_github_repo_url: https://github.com/${{ github.repository }}.git
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_github_token_secret_name: ${{ vars.GIT_TOKEN_SECRET_NAME }}
  TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}

jobs:
  dataform-compile:
    name: Dataform compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Dataform CLI
        run: npm install --global @dataform/cli

      # Fails on SQLX syntax errors, broken ref() calls, duplicate action names
      # and invalid config blocks. Needs no Google Cloud credentials.
      # Packages are installed at runtime because the project uses workflow_settings.yaml.
      - name: Compile
        run: dataform compile

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    # Pull requests from forks get no OIDC token and no repository variables.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="prefix=world-cup-dataform"

      - name: Validate
        run: terraform validate -no-color

      # Read-only account and no state lock: a pull request can never write the state.
      - name: Plan
        run: terraform plan -input=false -lock=false -no-color -out=tfplan

      - name: Show plan in job summary
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
