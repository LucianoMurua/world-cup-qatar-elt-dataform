name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies at the same time, and never cancel one halfway.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_github_repo_url: https://github.com/${{ github.repository }}.git
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_github_token_secret_name: ${{ vars.GIT_TOKEN_SECRET_NAME }}
  TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="prefix=world-cup-dataform"

      - name: Plan
        run: terraform plan -input=false -lock=false -no-color -out=tfplan

      - name: Show plan in job summary
        run: |
          {
            echo '### Terraform plan (to be applied)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment so the apply waits for
    # a manual approval after the plan above has been reviewed.
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_APPLY_SA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="prefix=world-cup-dataform"

      - name: Apply
        run: terraform apply -input=false -auto-approve
